[package]
name = "deno-lite"
version = "0.1.0"
edition = "2021"
authors = ["Divy Srivastava <dj.srivastava23@gmail.com>"]

[features]
use_v8 = ["v8", "serde_v8"]
use_quickjs = ["quick-js"]
use_jsc = ["rusty_jsc_sys"]
use_spidermonkey = ["mozjs"]

typescript = ["swc_common", "swc_ecma_codegen", "swc_ecma_parser", "swc_ecma_transforms_base", "swc_ecma_visit", "swc_ecma_transforms_typescript"]

default = ["use_v8", "typescript"]

[[bin]]
name = "deno-lite"
path = "main.rs"

[dependencies]
v8 = { version = "0.58.0", optional = true }
serde_v8 = { version = "0.73.0", optional = true }
rusty_jsc_sys = { version = "0.0.3", optional = true }
mozjs = { git = "https://github.com/servo/mozjs", rev = "0623d5fced66007ec7a35d1ca9a3cfd1b30f27f9", optional = true }
quick-js = { version = "0.4.1", optional = true }

swc_common = { version = "0.29.19", features = ["tty-emitter"], optional = true }
swc_ecma_codegen = { version = "0.128.7", optional = true  }
swc_ecma_parser = { version = "0.123.6", optional = true  }
swc_ecma_transforms_base = { version = "0.112.8", optional = true }
swc_ecma_visit = { version = "0.81.3", optional = true }
swc_ecma_transforms_typescript = { version = "0.160.10", optional = true }
